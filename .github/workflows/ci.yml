name: Pipeline de CI

on:
  push:
    branches: [ "main" ]

jobs:
  testes-unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Configurar a linguagem - nosso caso Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar as dependências
        run: |
          pip install -r requirements.txt

      - name: Rodar os testes unitários
        run: |
          pytest tests/unit
  
  
  testes-integracao:
    name: Testes integração
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Configurar a linguagem - nosso caso Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar as dependências
        run: |
          pip install -r requirements.txt

      - name: Rodar os testes integração
        run: |
          pytest tests/integration
  
  testes-e2e:
    name: Testes e2e
    
    needs: 
      - testes-unitarios
      - testes-integracao

    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Configurar a linguagem - nosso caso Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar as dependências
        run: |
          pip install -r requirements.txt

      - name: Rodar os testes e2e
        run: |
          pytest tests/e2e
          name: quality-gate
on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install ruff pytest pytest-cov
      - name: Lint
        run: ruff check .
      - name: Unitários
        run: pytest tests/unit -q
      - name: Integração
        run: pytest tests/integration -q
      - name: E2E
        run: pytest tests/e2e -q
      - name: Cobertura
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80